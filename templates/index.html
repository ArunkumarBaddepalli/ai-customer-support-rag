<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ company_name }} — Support Chat</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>:root { --brand-color: {{ brand_color }}; }</style>
</head>
<body>
  <div class="chat-container">
    <header>
      <div class="logo">{{ logo_emoji }}</div>
      <div>
        <h1>{{ company_name }}</h1>
        <p>{{ company_tagline }}</p>
      </div>
    </header>

    <div id="messages" class="messages">
      <div class="empty-state">
        <span class="empty-emoji">{{ logo_emoji }}</span>
        <p>Ask a question to get started — I'll answer using {{ company_name }}'s own docs and show you the source.</p>
      </div>
    </div>

    <form id="chat-form" class="chat-form">
      <input id="question-input" type="text" placeholder="Type your question..." autocomplete="off" required>
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
