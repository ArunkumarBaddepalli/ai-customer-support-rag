{% extends "base.html" %}
{% block title %}Log in — SupportBot{% endblock %}

{% block content %}
<div class="card narrow">
  <h1>Log in</h1>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post">
    <label>Email</label>
    <input type="email" name="email" value="{{ email }}" required autofocus>

    <label>Password</label>
    <input type="password" name="password" required>

    <button type="submit">Log in</button>
  </form>

  <p class="hint centered"><a href="{{ url_for('forgot_password') }}">Forgot your password?</a></p>
  <p class="hint centered">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
</div>
{% endblock %}
