<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Support Bot{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block nav %}
    <header class="topbar">
      <a class="brand" href="{{ url_for('home') }}">💬 SupportBot</a>
      <nav>
        {% if user %}
          <a href="{{ url_for('dashboard') }}">Dashboard</a>
          <a href="{{ url_for('logout') }}">Log out</a>
        {% else %}
          <a href="{{ url_for('login') }}">Log in</a>
          <a class="btn-link" href="{{ url_for('signup') }}">Sign up</a>
        {% endif %}
      </nav>
    </header>
  {% endblock %}

  {% if user and not user.email_verified %}
    <div class="verify-banner">
      <span>Verify your email address to secure your account.</span>
    </div>
  {% endif %}

  <main class="{% block main_class %}wrap{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
