name: CI

# Both suites were run by hand, which is how a check asserting against a path
# from an old machine survived for weeks: it failed on every run, and it was
# the assertion proving a path-traversal attempt had not deleted anything.
# Nothing catches that except something that runs every time.

# Documentation-only changes are skipped: the suite makes ~60 LLM calls on
# the same free-tier key production uses, and while it runs the live bot
# answers "can't answer right now" to real visitors. A README edit is not
# worth ten minutes of that.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", ".gitignore"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", ".gitignore"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # the scope step below diffs against the base commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"      # matches the Dockerfile
          cache: pip

      - name: Install the CPU-only torch build first
        # PyPI's default Linux wheel is the CUDA build: ~2.3 GB of NVIDIA
        # libraries that cannot execute here. Installing the CPU wheel first
        # means nothing downstream pulls the other one in.
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -c "import torch; assert '+cpu' in torch.__version__, torch.__version__"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Byte-compile everything
        # Catches a syntax error in a file no test happens to import.
        run: python -m compileall -q app.py db.py rag.py ingest.py mailer.py security.py seed_demo.py eval.py tests/

      - name: Unit tests
        # Pure functions — chunking, outcome parsing, text normalisation, slug
        # and redirect checks — run in seconds with no server, no database and
        # no LLM key, so a broken one is reported before the app even starts.
        run: python -m pytest -q tests/test_units.py

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2

      - name: Seed the demo workspace
        # No DATABASE_URL, so this runs against a throwaway SQLite file.
        env:
          SECRET_KEY: ci-secret-not-used-anywhere-real
        run: python seed_demo.py

      - name: Decide whether the LLM suites need to run
        # The answer-quality and end-to-end LLM checks make ~90 model calls
        # and reserve ~135K tokens — two-thirds of the free tier's 200K-per-day
        # budget, which production shares. Five runs in one afternoon left the
        # live bot unable to answer. So the model is only called when something
        # that could change an answer changed: retrieval, prompts, evaluation,
        # the demo corpus, or the suite itself. Everything else (templates,
        # CSS, JS, docs, CI) runs the suites with the model switched off, which
        # e2e.py reports as skipped rather than passed. workflow_dispatch
        # always runs everything.
        id: scope
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=$(git rev-parse HEAD~1); fi
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          printf 'changed:\n%s\n' "$CHANGED"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || echo "$CHANGED" | grep -Eq '^(rag\.py|ingest\.py|db\.py|eval\.py|seed_demo\.py|requirements\.txt|sample_docs/|tests/e2e\.py)'; then
            echo "llm=true"  >> "$GITHUB_OUTPUT"; echo "LLM suites: ON"
          else
            echo "llm=false" >> "$GITHUB_OUTPUT"; echo "LLM suites: OFF - nothing that shapes an answer changed"
          fi

      - name: Check the Groq key reaches the provider
        if: steps.scope.outputs.llm == 'true'
        # Prints only lengths and a status code, never the key. The first CI
        # run failed every answer with the generic fallback and the server log
        # showed nothing, because Python block-buffers stdout when redirected
        # to a file; this step makes a bad or whitespace-padded secret obvious.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python - <<'PY'
          import os, httpx
          k = os.environ.get("GROQ_API_KEY", "")
          if not k:
              print("no GROQ_API_KEY secret - answer-quality checks will be skipped"); raise SystemExit(0)
          print(f"key length {len(k)}, stripped {len(k.strip())}, padded with whitespace: {k != k.strip()}")
          r = httpx.get("https://api.groq.com/openai/v1/models",
                        headers={"Authorization": f"Bearer {k.strip()}"}, timeout=30)
          print("Groq /models:", r.status_code, "" if r.status_code == 200 else r.text[:200])
          PY

      - name: Start the app
        env:
          SECRET_KEY: ci-secret-not-used-anywhere-real
          GROQ_API_KEY: ${{ steps.scope.outputs.llm == 'true' && secrets.GROQ_API_KEY || '' }}
          FLASK_DEBUG: "false"
          PYTHONUNBUFFERED: "1"     # so the server log is complete when it is printed on failure
        run: |
          python app.py > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:5001/ && exit 0
            sleep 2
          done
          echo "app did not start:"; cat server.log; exit 1

      - name: End-to-end suite
        # With the key withheld (see the scope step) the answer-quality checks
        # are skipped and reported as skipped — everything else still runs.
        env:
          GROQ_API_KEY: ${{ steps.scope.outputs.llm == 'true' && secrets.GROQ_API_KEY || '' }}
        run: python tests/e2e.py

      - name: Answer-quality suite
        if: steps.scope.outputs.llm == 'true'
        # eval.py is the suite that caught the Retry-After regression (41 -> 30)
        # while e2e stayed green — e2e asserts that an answer arrives, eval
        # asserts what it says. Without the key it is skipped with a message
        # rather than failing on a working app.
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EVAL_MIN_CORRECT: "43"
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY secret not set — answer-quality suite skipped"; exit 0
          fi
          python eval.py

      - name: Server log on failure
        if: failure()
        run: cat server.log

  deploy:
    # Deploys to Render only after the whole test job passed, and only for a
    # push to main. The hosting side's own GitHub auto-deploy went silent on
    # 2026-08-21 without any error surfacing anywhere — five weeks of pushes,
    # including a security fix, never built. This step does not depend on that
    # link: it calls Render's Deploy Hook, a URL whose only power is "build the
    # configured branch now", which is the least privilege that does the job.
    #
    # Needs one repository secret, RENDER_DEPLOY_HOOK, copied from Render ->
    # service -> Settings -> Deploy Hook. Without it the step says so and
    # succeeds, so a fork or a checkout without deploy rights still gets a
    # green run for its tests.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger the Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret not set — deploy skipped (tests passed)"; exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" -o /dev/null -w "Render accepted the deploy: HTTP %{http_code}\n"
